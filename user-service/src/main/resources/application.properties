spring.application.name=user-service
server.port=8081

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/streamcart_users
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT
jwt.secret=streamcart-super-secret-key-change-in-production-min-32-chars
jwt.expiration-ms=86400000

# gRPC server - a second, separate Netty server next to Tomcat (8081).
# Internal only: not routed through the API gateway.
grpc.server.port=9091

# Observability: Prometheus scrapes /actuator/prometheus. The "application" tag is added
# to every metric so one Grafana dashboard can split by service. Histogram buckets let
# Prometheus compute p95/p99 latency (count+sum alone can only give an average).
management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
