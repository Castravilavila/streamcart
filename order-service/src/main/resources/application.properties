spring.application.name=order-service
server.port=8083

# PostgreSQL (same DB host as user-service, different schema/db)
spring.datasource.url=jdbc:postgresql://localhost:5432/streamcart_orders
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Kafka producer
# Values are Protobuf-encoded bytes (see streamcart-proto/order_events.proto), so the
# Kafka-level serializer is just a pass-through for byte[].
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.ByteArraySerializer

# gRPC client -> user-service. "user-service" is the channel name used in @GrpcClient.
# static:// = fixed address (no service discovery yet). plaintext = no TLS (local dev only).
grpc.client.user-service.address=static://localhost:9091
grpc.client.user-service.negotiation-type=plaintext
