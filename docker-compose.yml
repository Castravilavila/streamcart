version: "3.9"

services:

  # PostgreSQL for user-service and order-service.
  # One container hosts two logical databases (created by the init script below).
  postgres:
    image: postgres:16-alpine
    container_name: streamcart-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB for product-service.
  mongodb:
    image: mongo:7
    container_name: streamcart-mongodb
    environment:
      MONGO_INITDB_DATABASE: streamcart_products
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # Redis for product-service caching.
  redis:
    image: redis:7-alpine
    container_name: streamcart-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Zookeeper is required by Kafka to manage brokers and topics.
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: streamcart-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  # Kafka for order-service event publishing.
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: streamcart-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data

  # RabbitMQ for notification-service messaging.
  # The management UI is available on http://localhost:15672 (guest / guest).
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: streamcart-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  kafka_data:
  rabbitmq_data:
