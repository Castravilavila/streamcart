# Tells Grafana to load every *.json dashboard found in /var/lib/grafana/dashboards
# (mounted from ./grafana/dashboards in docker-compose.yml) into a "StreamCart" folder.
apiVersion: 1

providers:
  - name: streamcart
    folder: StreamCart
    type: file
    disableDeletion: false
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
